on:
  schedule:
    - cron: "0 0 * * *"
  push:
    branches:
      - main

jobs:
  build:
    permissions:
      contents: write
      # required for npm trusted publishing (OIDC)
      id-token: write
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - id: build
        run: cd src && npm install -g pnpm && pnpm install && pnpm start
      # commit generated files even if publishing failed; the package
      # versions are reverted on failure so the next run retries the publish
      - uses: EndBug/add-and-commit@v11
        if: ${{ !cancelled() && steps.build.outputs.outputs_generated == 'true' }}
        with:
          default_author: github_actions
